notes: >-
  These are the calibrated 512x512 bags (images are 16-bit). Ground truth is the 120 Hz motion capture on
  /vrpn_client/raw_transform, already in the IMU frame. It covers the whole trajectory only for room*;
  corridor, magistrale, outdoors and slides have it only at the start and end.
