title: NCLT (University of Michigan North Campus Long-Term)
source: http://robots.engin.umich.edu/nclt/
hf_repo: gladiator7737/nclt
license: Open Database License (ODbL) 1.0, contents under the Database Contents License. Attribution required; derivatives shared alike.
hf_license: odbl
convert: nclt
bag_note: built from the raw NCLT logs by nclt.py in github.com/woosik2510/mins-datasets
notes: >-
  Segway robot, 27 sessions over 15 months, ~5.5 km each. Ladybug images and Hokuyo scans are not included.
  GPS keeps only 3D fixes (mode 3) with zero covariance, so set the noise in your config. Wheel speeds are
  linear m/s, not rad/s. Velodyne scans are one revolution each and every point carries its own time (s, from
  the scan stamp). Ground truth is the NCLT SLAM + RTK solution (body pose in local NED) converted to quaternions;
  it is optimised at ~8 m nodes and odometry-interpolated in between.
topics:
  imu: /imu (Microstrain 3DM-GX3-45, ~50 Hz, no orientation)
  gps: /gps/fix (Garmin consumer GPS), /gps_rtk/fix (NovAtel RTK), sensor_msgs/NavSatFix
  wheels: /wheels (sensor_msgs/JointState, velocity = [left, right] m/s)
  lidar: /velodyne_points (Velodyne HDL-32E, one revolution per message, fields x y z intensity ring time)
