%YAML:1.0 # need to specify the file type at the top!

sys:
  verbosity: 2
  save_timing: true
  path_timing: "/tmp/mins/0.time"
  save_state: false
  path_state: "/tmp/mins/0/"
  save_trajectory: true
  path_trajectory: "/tmp/mins/0.txt"
  save_prints: false
  exp_id: 0

  path_bag: "/dev/stdin"
  bag_start: 0
  bag_durr: -1
