name: nclt-probe

# One-off measurement: free disk after cleanup, download speed from the NCLT bucket, and how long and how
# much disk converting one session on the fly takes. Uploads nothing.

on:
  push:
    branches: [nclt]
    paths: [nclt.py, .github/workflows/nclt-probe.yml]
  workflow_dispatch:
    inputs:
      seq:
        description: "NCLT session"
        default: "2012-01-15"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SEQ: ${{ inputs.seq || '2012-01-15' }}
    steps:
      - uses: actions/checkout@v4
      - name: Disk before cleanup
        run: df -h / /mnt
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost \
            /usr/share/swift /usr/local/share/powershell /usr/local/.ghcup /usr/local/share/chromium
          sudo docker image prune -af >/dev/null
          sudo chmod 777 /mnt
          df -h / /mnt
      - run: pip install -q pyyaml==6.0.3 rosbags==0.11.5 "huggingface_hub[hf_xet]==0.36.0"
      - name: Download speed from the NCLT bucket
        run: |
          curl -sS -r 0-1999999999 -o /dev/null -w "%{speed_download}\n" \
            "https://s3.us-east-2.amazonaws.com/nclt.perl.engin.umich.edu/velodyne_data/${SEQ}_vel.tar.gz" \
            | awk '{printf "download: %.0f MB/s\n", $1/1e6}' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Convert on the fly
        run: |
          # Same rule as mirror.py: write where there is more room
          if [ "$(df --output=avail / | tail -1)" -gt "$(df --output=avail /mnt | tail -1)" ]; then out=$HOME/nclt; else out=/mnt/nclt; fi
          mkdir -p "$out"
          used0=$(df --output=used -B1M "$out" | tail -1)
          (peak=0; while true; do u=$(df --output=used -B1M "$out" | tail -1); if [ "$u" -gt "$peak" ]; then peak=$u; echo $((peak - used0)) > /tmp/peak; fi; sleep 2; done) &
          /usr/bin/time -v python3 nclt.py "$SEQ" "$out" 2> time.txt || { cat time.txt; exit 1; }
          kill %1
          {
            echo "session: $SEQ, cores: $(nproc), out dir: $out"
            grep -E "Elapsed" time.txt | sed "s/^\s*/convert: /"
            grep -E "Maximum resident" time.txt | sed "s/^\s*/convert: /"
            echo "bag: $(du -BG "$out/$SEQ.bag" | cut -f1)"
            echo "peak extra disk: $(( $(cat /tmp/peak) / 1024 )) GB"
            df -h / /mnt | sed "s/^/after: /"
          } | tee -a "$GITHUB_STEP_SUMMARY"
